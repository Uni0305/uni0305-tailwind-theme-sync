name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json version
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Package
        run: |
          zip -r "tailwind-theme-sync-$GITHUB_REF_NAME.zip" \
            manifest.json dist/index.html dist/code.js LICENSE.md licenses
      - uses: softprops/action-gh-release@v3
        with:
          files: tailwind-theme-sync-${{ github.ref_name }}.zip
          generate_release_notes: true
